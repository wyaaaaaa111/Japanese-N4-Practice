<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f5f7f2">
  <title>日语 N4 练习室</title>
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <main class="page-shell">
    <header class="topbar">
      <a class="brand" href="#top" aria-label="日语练习室首页">
        <span class="brand-mark" aria-hidden="true">あ</span>
        <span>ことば <span class="brand-light">练习室</span></span>
      </a>
      <span class="level-pill"><span class="status-dot"></span> JLPT N4 · 基础练习</span>
    </header>

    <section class="intro" id="top">
      <p class="eyebrow">DAILY JAPANESE · 01</p>
      <h1>每天一点，<span>日语更进一步。</span></h1>
      <p class="intro-copy">用 5 道小练习，轻松复习 N4 语法与词汇。</p>
    </section>

    <section class="practice-card" aria-labelledby="question-title">
      <div class="card-topline">
        <div class="lesson-label"><span class="lesson-icon" aria-hidden="true">文</span><span>语法与词汇</span></div>
        <span class="question-count" id="question-count">第 1 题 <span>/ 5</span></span>
      </div>
      <div class="progress-track" role="progressbar" aria-label="练习进度" aria-valuemin="0" aria-valuemax="5" aria-valuenow="0" id="progress-track"><span id="progress-fill"></span></div>

      <div class="question-area" id="question-area">
        <p class="question-kicker" id="question-kicker">选择最合适的答案</p>
        <h2 id="question-title"></h2>
        <p class="translation" id="question-translation"></p>
        <form id="answer-form">
          <fieldset class="choices" id="choices">
            <legend class="visually-hidden">答案选项</legend>
          </fieldset>
          <p class="feedback" id="feedback" role="status" aria-live="polite" hidden></p>
          <div class="actions">
            <span class="keyboard-hint">选好答案后提交</span>
            <button class="primary-button" id="submit-button" type="submit">提交答案 <span aria-hidden="true">↗</span></button>
            <button class="primary-button" id="next-button" type="button" hidden>下一题 <span aria-hidden="true">→</span></button>
          </div>
        </form>
      </div>
      <div class="result-panel" id="result-panel" hidden>
        <div class="result-icon" aria-hidden="true">✦</div>
        <p class="eyebrow">PRACTICE COMPLETE</p>
        <h2>练习完成！</h2>
        <p class="result-copy" id="result-copy"></p>
        <button class="primary-button" id="restart-button" type="button">再练习一次 <span aria-hidden="true">↻</span></button>
      </div>
    </section>

    <footer class="page-footer"><span>慢慢来，每一次练习都算数。</span><span class="footer-sparkle" aria-hidden="true">✳</span></footer>
  </main>
</body>
</html>
